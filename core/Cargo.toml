[package]
name = "stem"
version = "0.4.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "stem"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
crossterm = "0.29"
ctrlc = "3.5.2"
dirs = "7.0.0"
flate2 = "1.1.11"
getrandom = "0.4.3"
globset = "0.4.21"
ignore = "0.4.34"
nu-ansi-term = "0.50.3"
reedline = "0.52.1"
regex = "1.13.1"
rquickjs = { version = "0.14.0", features = ["macro", "array-buffer", "classes", "properties"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11"
sha2 = "0.11.1"
tar = "0.4.46"
tree-sitter = "0.27"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-tags = "0.27"
tree-sitter-typescript = "0.23"
ureq = { version = "3.5.1", features = ["json"] }
xxhash-rust = { version = "0.8.19", features = ["xxh64"] }
zip = "9.4.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
