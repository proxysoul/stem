<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="The loop: you give a task, the model answers in text or one JavaScript block, the block runs in a QuickJS sandbox that only sees $ (edit, rename, test, sh, sql, refs, testsFor, ask), which reads code facts and language servers, and only the return value goes back to the model."><style>
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes pulse{0%,100%{opacity:.78}50%{opacity:1}}
.sway{transform-box:view-box;transform-origin:0 0;animation:sway 3.2s ease-in-out infinite}
.caret{animation:caret 1s steps(1,end) infinite}
.bob{animation:bob 5s ease-in-out infinite}
.flow{stroke-dasharray:6 14;animation:flow 1.1s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
<radialGradient id="g1" cx="0.18" cy="0.5" r="0.5"><stop offset="0" stop-color="#7fd88f" stop-opacity="0.2"/><stop offset="1" stop-color="#7fd88f" stop-opacity="0"/></radialGradient>
