<radialGradient id="g3" cx="0.7" cy="1.1" r="0.5"><stop offset="0" stop-color="#eca3c4" stop-opacity="0.14"/><stop offset="1" stop-color="#eca3c4" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#eeeeec" fill-opacity="0.07"/></pattern>
<clipPath id="clip"><rect width="1280" height="400" rx="28"/></clipPath>
</defs>
<g clip-path="url(#clip)"><rect width="1280" height="400" fill="#0b1116"/><rect width="1280" height="400" fill="url(#dots)"/><rect width="1280" height="400" fill="url(#g1)"/><rect width="1280" height="400" fill="url(#g2)"/></g>
