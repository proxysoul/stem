name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, exe: "" }
          - { os: macos-15, exe: "" }
          - { os: windows-2025, exe: .exe }
          - { os: windows-11-arm, exe: .exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: core
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: cargo build --release --locked
      - run: cargo clippy --release --locked
      - run: STEM="$PWD/target/release/stem${{ matrix.exe }}" bash tests/smoke.sh
