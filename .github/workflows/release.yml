name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: core
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: |
          cd target/${{ matrix.target }}/release
          tar czf stem-${{ matrix.target }}.tar.gz stem
          shasum -a 256 stem-${{ matrix.target }}.tar.gz > stem-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stem-${{ matrix.target }}
          path: core/target/${{ matrix.target }}/release/stem-${{ matrix.target }}.tar.gz*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          files: dist/*
  package:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - name: Assemble the npm package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match core/Cargo.toml version $version" >&2
            exit 1
          fi
          for archive in dist/stem-*.tar.gz; do
            (cd dist && shasum -a 256 -c "$(basename "$archive").sha256")
            target=$(basename "$archive" .tar.gz)
            target=${target#stem-}
            mkdir -p "npm/vendor/$target"
            tar xzf "$archive" -C "npm/vendor/$target"
            chmod +x "npm/vendor/$target/stem"
          done
          cp README.md LICENSE npm/
          cd npm
          npm pkg set version="$version"
          test "$(./vendor/x86_64-unknown-linux-gnu/stem --version)" = "stem $version"
          test "$(node bin/stem.js --version)" = "stem $version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Publish to GitHub Packages
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '@proxysoul:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > .npmrc
          if npm view "@proxysoul/stem@$VERSION" version >/dev/null 2>&1; then
            echo "@proxysoul/stem@$VERSION is already published; nothing to do"
          else
            npm publish
          fi
